# /etc/openresty/conf.d/probe.geneyuriy.com.conf  (included by nginx.conf)
# Certificates are installed by acme.sh --install-cert into /etc/openresty/certs.
server {
    listen 80;
    listen [::]:80;
    server_name probe.geneyuriy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name probe.geneyuriy.com;

    ssl_certificate     /etc/openresty/certs/probe.geneyuriy.com.fullchain.pem;
    ssl_certificate_key /etc/openresty/certs/probe.geneyuriy.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:probe_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (agents on /ws/agent) and SSE (dashboard) are long-lived.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # map defined in nginx.conf
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
